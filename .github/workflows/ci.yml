name: Enterprise Migration Lab CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "infra/**"
      - "docs/**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Application Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          python -m compileall -q applications/authentication-service
          python -m compileall -q applications/backend-api

      - name: Validate Docker Compose
        run: docker compose config --quiet
